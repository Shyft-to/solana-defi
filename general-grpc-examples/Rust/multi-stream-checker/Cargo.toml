[package]
name = "multi-stream-checker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "multi-stream-checker"
path = "src/main.rs"

[dependencies]
# Yellowstone gRPC client
yellowstone-grpc-client = "13.1.0"
yellowstone-grpc-proto  = "12.3.0"

# Async runtime
tokio          = { version = "1", features = ["full"] }

# gRPC / tonic
# `tls-native-roots` supplies the root certificates; `tls-ring` supplies the
# crypto provider. Without a provider feature, rustls 0.23 cannot pick one and
# panics on the first TLS handshake.
tonic          = { version = "0.14", features = ["tls-native-roots", "tls-ring"] }

# Logging / config / encoding
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow             = "1"
dotenvy            = "0.15"
futures            = "0.3"
bs58               = "0.5"
chrono             = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Slack disconnect alerts
reqwest    = { version = "0.11", features = ["json"] }
serde_json = "1"
